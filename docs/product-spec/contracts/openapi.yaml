openapi: 3.1.0
info:
  title: Ship Dễ Internal API
  version: 1.0.0
  description: Baseline frontend/backend contract. Extend without changing documented semantics.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Organization
  - name: Carriers
  - name: Orders
  - name: Shipping
  - name: Tracking
  - name: Reconciliation
  - name: Claims
  - name: Health
paths:
  /health/live:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Operational liveness probe (API-FOUND-HEALTH-LIVE)
      description: Returns 200 when the process is alive without querying downstream dependencies.
      operationId: getHealthLive
      security: []
      responses:
        '200':
          description: Process event loop is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Operational readiness probe (API-FOUND-HEALTH-READY)
      description: Returns 200 when all required infrastructure dependencies (PostgreSQL, Redis, S3) are healthy, or 503 if any dependency is unavailable.
      operationId: getHealthReady
      security: []
      responses:
        '200':
          description: All required dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register new merchant and owner user (API-AUTH-REGISTER)
      description: Creates a new merchant tenant and its initial owner user in a single transaction in pending-verification status.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration initiated, pending verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify user email using verification token (API-AUTH-VERIFY-EMAIL)
      description: Verifies email address using single-use token and activates user if eligible.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /auth/verify-phone:
    post:
      tags: [Auth]
      summary: Verify user phone using OTP (API-AUTH-VERIFY-PHONE)
      description: Verifies phone number using OTP code and activates user if eligible.
      operationId: verifyPhone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneRequest'
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /auth/verify/resend:
    post:
      tags: [Auth]
      summary: Resend verification token or OTP (API-AUTH-RESEND-VERIFICATION)
      description: Re-issues a verification token or phone OTP subject to independent rate limits.
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification token or OTP resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Auth]
      summary: Password login (API-AUTH-LOGIN, FEAT-AUTH-03)
      description: >-
        Authenticates with email/Vietnamese phone + password. Identical
        INVALID_CREDENTIALS response for unknown identifier or wrong password.
        Non-active statuses are rejected with distinct 403 codes
        (AUTH_PENDING_VERIFICATION, AUTH_ACCOUNT_SUSPENDED, AUTH_ACCOUNT_DISABLED,
        AUTH_INVITATION_PENDING). Rate limited per IP and per identifier.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated or MFA challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: INVALID_CREDENTIALS
          $ref: '#/components/responses/Error'
        '403':
          description: Account status gate or OTP login disabled
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login/otp/request:
    post:
      tags: [Auth]
      summary: Request a login OTP (API-AUTH-LOGIN-OTP-REQUEST, FEAT-AUTH-03)
      description: >-
        Sends a 6-digit login OTP over the verified channel (email or phone).
        Requires AUTH_LOGIN_OTP_ENABLED. Generic OTP_SENT response; unknown
        identifiers or unverified channels receive the same response without delivery.
      operationId: requestLoginOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginOtpRequestRequest'
      responses:
        '200':
          description: Generic OTP challenge (anti-enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOtpChallengeResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: AUTH_OTP_LOGIN_DISABLED when OTP login is not enabled
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login/otp/verify:
    post:
      tags: [Auth]
      summary: Verify a login OTP and issue a session (API-AUTH-LOGIN-OTP-VERIFY, FEAT-AUTH-03)
      description: >-
        Verifies the 6-digit login OTP (5-minute TTL, single use, max 5 wrong
        attempts) and returns the same session shape as password login.
      operationId: verifyLoginOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginOtpVerifyRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: INVALID_OTP
          $ref: '#/components/responses/Error'
        '403':
          description: Account status gate or OTP login disabled
          $ref: '#/components/responses/Error'
        '410':
          description: OTP_ALREADY_CONSUMED or OTP_EXPIRED
          $ref: '#/components/responses/Error'
        '429':
          description: OTP_MAX_ATTEMPTS_EXCEEDED or RATE_LIMITED
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        '200':
          description: Current user and memberships
  /sessions:
    post:
      tags: [Auth]
      summary: Create a new session at login (API-SESSION-CREATE, FEAT-AUTH-06)
      description: |
        Creates a device session for the authenticated user. This endpoint is used
        by the login flow (FEAT-AUTH-03) to issue a session token. The raw token
        is returned once and never stored; only its SHA-256 hash is persisted.
      operationId: createSession
      security: []  # Called by login flow which provides merchant context via internal service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: Cross-tenant session creation forbidden
          $ref: '#/components/responses/Error'
    get:
      tags: [Auth]
      summary: List active sessions for current user (API-SESSION-LIST, FEAT-AUTH-06)
      description: |
        Returns all sessions for the authenticated user within the merchant tenant.
        Sessions expired by inactivity (30 days) or absolute lifetime (90 days) are
        marked EXPIRED. The current session is marked with is_current=true.
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged list of sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '401':
          $ref: '#/components/responses/Error'
  /sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke a single session (API-SESSION-REVOKE, FEAT-AUTH-06)
      description: |
        Revokes the specified session. Idempotent: revoking an already-revoked
        session returns success. Requires ownership (same user) or admin scope.
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Not owner of session or cross-tenant
          $ref: '#/components/responses/Error'
        '404':
          description: Session not found
          $ref: '#/components/responses/Error'
    patch:
      tags: [Auth]
      summary: Update session last activity (heartbeat) (API-SESSION-HEARTBEAT, FEAT-AUTH-06)
      description: |
        Updates the last_active_at timestamp for the current session only.
        Returns 403 if session is not ACTIVE or not owned by caller.
      operationId: heartbeatSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Heartbeat updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatSessionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Session not active or not owned by caller
          $ref: '#/components/responses/Error'
        '404':
          description: Session not found
          $ref: '#/components/responses/Error'
  /sessions/revoke-all:
    post:
      tags: [Auth]
      summary: Revoke all sessions for current user (API-SESSION-REVOKE-ALL, FEAT-AUTH-06)
      description: |
        Revokes all active sessions for the authenticated user. Optionally includes
        the current session (logout everywhere). Returns count of revoked sessions.
      operationId: revokeAllSessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAllSessionsRequest'
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAllSessionsResponse'
        '401':
          $ref: '#/components/responses/Error'
  /shops:
    get:
      tags: [Organization]
      operationId: listShops
      responses:
        '200':
          description: Authorized shops
    post:
      tags: [Organization]
      operationId: createShop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopInput'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Error'
  /carrier-accounts:
    get:
      tags: [Carriers]
      operationId: listCarrierAccounts
      responses:
        '200':
          description: Carrier accounts in scope
    post:
      tags: [Carriers]
      operationId: connectCarrierAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierAccountInput'
      responses:
        '202':
          description: Connection test queued
        '400':
          $ref: '#/components/responses/Error'
  /carrier-accounts/{id}/test:
    post:
      tags: [Carriers]
      operationId: testCarrierAccount
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged source orders
    post:
      tags: [Orders]
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceOrderInput'
      responses:
        '201':
          description: Source order created
        '400':
          $ref: '#/components/responses/Error'
  /orders/{id}/shipping-options:
    post:
      tags: [Shipping]
      operationId: getShippingOptions
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /orders/{id}/routing-decision:
    post:
      tags: [Shipping]
      operationId: selectShippingOption
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
                  format: uuid
                override_reason:
                  type: string
      responses:
        '201':
          description: Routing decision persisted
        '409':
          $ref: '#/components/responses/Error'
  /shipments:
    post:
      tags: [Shipping]
      operationId: createShipment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_order_id, routing_decision_id]
              properties:
                source_order_id:
                  type: string
                  format: uuid
                routing_decision_id:
                  type: string
                  format: uuid
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '409':
          $ref: '#/components/responses/Error'
  /shipments/{id}:
    get:
      tags: [Shipping]
      operationId: getShipment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Shipment detail
        '404':
          $ref: '#/components/responses/Error'
  /shipments/{id}/cancel:
    post:
      tags: [Shipping]
      operationId: cancelShipment
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /shipments/{id}/label:
    get:
      tags: [Shipping]
      operationId: getShipmentLabel
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Private label download reference or bytes
  /shipments/{id}/redelivery:
    post:
      tags: [Shipping]
      operationId: requestRedelivery
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /shipments/{id}/tracking:
    get:
      tags: [Tracking]
      operationId: getTracking
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Canonical and raw-safe timeline
  /audit-periods:
    post:
      tags: [Reconciliation]
      operationId: createAuditPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditPeriodInput'
      responses:
        '201':
          description: Period created
  /audit-periods/{id}/runs:
    post:
      tags: [Reconciliation]
      operationId: runAudit
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /batches/{id}/bank-allocations:
    post:
      tags: [Reconciliation]
      operationId: allocateBankTransaction
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAllocationInput'
      responses:
        '201':
          description: Allocation confirmed
        '409':
          $ref: '#/components/responses/Error'
  /cases/{id}/transitions:
    post:
      tags: [Claims]
      operationId: transitionCase
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseTransitionInput'
      responses:
        '201':
          description: Case transition recorded
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Error:
      description: Canonical error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded (RATE_LIMITED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CommandAccepted:
      description: Command accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [merchant_name, full_name, password, terms_accepted, terms_version]
      properties:
        merchant_name:
          type: string
          minLength: 2
          maxLength: 100
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        terms_accepted:
          type: boolean
        terms_version:
          type: string
    RegistrationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user_id, merchant_id, status]
          properties:
            user_id:
              type: string
              format: uuid
            merchant_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING_VERIFICATION, ACTIVE]
            email:
              type: string
            phone:
              type: string
            message:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    VerifyPhoneRequest:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string
    VerifyResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user_id, merchant_id, status, channel, verified]
          properties:
            user_id:
              type: string
              format: uuid
            merchant_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING_VERIFICATION, ACTIVE]
            channel:
              type: string
              enum: [email, phone]
            verified:
              type: boolean
        meta:
          $ref: '#/components/schemas/Meta'
    ResendVerificationRequest:
      type: object
      required: [identifier, channel]
      properties:
        identifier:
          type: string
        channel:
          type: string
          enum: [email, phone]
    ResendVerificationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status, channel]
          properties:
            status:
              type: string
              enum: [SENT, RATE_LIMITED]
            channel:
              type: string
              enum: [email, phone]
            cooldown_seconds:
              type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email or Vietnamese phone number of the account.
        password:
          type: string
          format: password
        remember_device:
          type: boolean
          default: false
    AuthenticatedUser:
      type: object
      required: [id, merchant_id, full_name, role, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [OWNER, OPS_CSKH, WAREHOUSE, ACCOUNTANT]
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION, SUSPENDED, DISABLED, INVITED]
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    AuthenticatedMerchant:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        business_code:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [AUTHENTICATED, MFA_REQUIRED, ORG_SELECTION_REQUIRED]
            access_token:
              type: string
            expires_in:
              type: integer
              description: Access token lifetime in seconds (present when access_token is returned).
            challenge_id:
              type: string
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
            merchant:
              $ref: '#/components/schemas/AuthenticatedMerchant'
        meta:
          $ref: '#/components/schemas/Meta'
    LoginOtpRequestRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: Email or Vietnamese phone number of the account.
    LoginOtpChallengeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required:
            [status, channel, recipient_masked, cooldown_seconds, expires_in_seconds, message]
          properties:
            status:
              type: string
              enum: [OTP_SENT]
            channel:
              type: string
              enum: [email, phone]
            recipient_masked:
              type: string
              description: Masked recipient, e.g. m***@shipde.vn or 0901***4567.
            cooldown_seconds:
              type: integer
            expires_in_seconds:
              type: integer
            message:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'
    LoginOtpVerifyRequest:
      type: object
      required: [identifier, otp]
      properties:
        identifier:
          type: string
          description: Email or Vietnamese phone number of the account.
        otp:
          type: string
          minLength: 6
          maxLength: 6
    ShopInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        legal_name:
          type: string
        tax_code:
          type: string
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
    CarrierAccountInput:
      type: object
      required: [carrier_code, alias, permission_profile, credential]
      properties:
        carrier_code:
          type: string
          enum: [GHN, GHTK, VIETTEL_POST, JT_EXPRESS]
        alias:
          type: string
        permission_profile:
          type: string
          enum: [OBSERVE, ACTION]
        credential:
          type: object
          additionalProperties: true
          writeOnly: true
    SourceOrderInput:
      type: object
      # prettier-ignore
      required: [source_order_code, warehouse_id, recipient, address, parcels, expected_cod_vnd, fee_payer]
      properties:
        source_order_code:
          type: string
        warehouse_id:
          type: string
          format: uuid
        recipient:
          type: object
          required: [name, phone]
          properties:
            name:
              type: string
            phone:
              type: string
        address:
          type: object
          required: [line1, province, district, ward]
          properties:
            line1:
              type: string
            province:
              type: string
            district:
              type: string
            ward:
              type: string
        expected_cod_vnd:
          type: integer
          minimum: 0
        fee_payer:
          type: string
          enum: [SHOP, RECIPIENT, OTHER]
        parcels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ParcelInput'
    ParcelInput:
      type: object
      required: [weight_gram, declared_value_vnd]
      properties:
        weight_gram:
          type: integer
          minimum: 1
        length_cm:
          type: integer
          minimum: 1
        width_cm:
          type: integer
          minimum: 1
        height_cm:
          type: integer
          minimum: 1
        declared_value_vnd:
          type: integer
          minimum: 0
    AuditPeriodInput:
      type: object
      required: [carrier_account_id, period_start, period_end]
      properties:
        carrier_account_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
    BankAllocationInput:
      type: object
      required: [bank_transaction_id, allocated_amount_vnd]
      properties:
        bank_transaction_id:
          type: string
          format: uuid
        allocated_amount_vnd:
          type: integer
          minimum: 1
        confirmation_note:
          type: string
    CaseTransitionInput:
      type: object
      required: [target_status, reason]
      properties:
        target_status:
          type: string
        reason:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
        amount_vnd:
          type: integer
          minimum: 0
    CommandResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [command_id, status]
          properties:
            command_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING, SUCCEEDED, FAILED, OUTCOME_UNKNOWN]
            resource_id:
              type: string
              format: uuid
            next_action:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            next_action:
              type: string
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      required: [correlation_id]
      properties:
        correlation_id:
          type: string
    LivenessResponse:
      type: object
      required: [status, service, timestamp, correlationId]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: api
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
    CreateSessionRequest:
      type: object
      required: [user_id, device_id]
      properties:
        user_id:
          type: string
          format: uuid
        device_id:
          type: string
          minLength: 1
          maxLength: 128
        device_model:
          type: string
          maxLength: 128
        user_agent:
          type: string
          maxLength: 512
        ip_address:
          type: string
          maxLength: 64
        fcm_token:
          type: string
          maxLength: 256
    CreateSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [session_id, session_token, device_id, status, expires_at, created_at]
          properties:
            session_id:
              type: string
              format: uuid
            session_token:
              type: string
              description: Raw session token (returned once only)
            device_id:
              type: string
            device_model:
              type: string
            status:
              type: string
              enum: [ACTIVE, REVOKED, EXPIRED, INACTIVE]
            expires_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'
    SessionListItem:
      type: object
      required: [session_id, device_id, status, last_active_at, expires_at, created_at, is_current]
      properties:
        session_id:
          type: string
          format: uuid
        device_id:
          type: string
        device_model:
          type: string
        user_agent:
          type: string
        ip_address:
          type: string
          description: SHA-256 truncated hash of IP address
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED, INACTIVE]
        last_active_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        is_current:
          type: boolean
          description: True if this is the current session making the request
    ListSessionsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionListItem'
        meta:
          $ref: '#/components/schemas/Meta'
    RevokeSessionResponse:
      type: object
      required: [session_id, status, message]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REVOKED]
        message:
          type: string
    RevokeAllSessionsRequest:
      type: object
      properties:
        include_current:
          type: boolean
          default: false
    RevokeAllSessionsResponse:
      type: object
      required: [revoked_count, message]
      properties:
        revoked_count:
          type: integer
          minimum: 0
        message:
          type: string
    HeartbeatSessionResponse:
      type: object
      required: [session_id, last_active_at]
      properties:
        session_id:
          type: string
          format: uuid
        last_active_at:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      required: [status, service, timestamp, correlationId, checks]
      properties:
        status:
          type: string
          enum: [ok, error]
        service:
          type: string
          example: api
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        checks:
          type: object
          required: [database, redis, storage]
          properties:
            database:
              type: string
              enum: [up, down]
            redis:
              type: string
              enum: [up, down]
            storage:
              type: string
              enum: [up, down]
          additionalProperties:
            type: string
            enum: [up, down]
