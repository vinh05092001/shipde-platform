openapi: 3.1.0
info:
  title: Ship Dễ Internal API
  version: 1.0.0
  description: Baseline frontend/backend contract. Extend without changing documented semantics.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Organization
  - name: Carriers
  - name: Orders
  - name: Shipping
  - name: Tracking
  - name: Reconciliation
  - name: Claims
  - name: Health
paths:
  /health/live:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Operational liveness probe (API-FOUND-HEALTH-LIVE)
      description: Returns 200 when the process is alive without querying downstream dependencies.
      operationId: getHealthLive
      security: []
      responses:
        '200':
          description: Process event loop is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Operational readiness probe (API-FOUND-HEALTH-READY)
      description: Returns 200 when all required infrastructure dependencies (PostgreSQL, Redis, S3) are healthy, or 503 if any dependency is unavailable.
      operationId: getHealthReady
      security: []
      responses:
        '200':
          description: All required dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register new merchant and owner user (API-AUTH-REGISTER)
      description: Creates a new merchant tenant and its initial owner user in a single transaction in pending-verification status.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration initiated, pending verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify user email using verification token (API-AUTH-VERIFY-EMAIL)
      description: Verifies email address using single-use token and activates user if eligible.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /auth/verify-phone:
    post:
      tags: [Auth]
      summary: Verify user phone using OTP (API-AUTH-VERIFY-PHONE)
      description: Verifies phone number using OTP code and activates user if eligible.
      operationId: verifyPhone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneRequest'
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /auth/verify/resend:
    post:
      tags: [Auth]
      summary: Resend verification token or OTP (API-AUTH-RESEND-VERIFICATION)
      description: Re-issues a verification token or phone OTP subject to independent rate limits.
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification token or OTP resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/admin/create-shop-account:
    post:
      tags: [Auth]
      summary: Admin-create a shop and initial owner account (API-AUTH-ADMIN-CREATE-SHOP)
      description: Operator creates a new merchant tenant and its initial OWNER user in ACTIVE status without public self-registration. Requires x-operator-token header.
      operationId: adminCreateShopAccount
      security: []
      parameters:
        - name: x-operator-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateShopAccountRequest'
      responses:
        '201':
          description: Shop and owner account created, status active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreateShopAccountResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated or MFA challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Error'
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        '200':
          description: Current user and memberships
  /shops:
    get:
      tags: [Organization]
      operationId: listShops
      responses:
        '200':
          description: Authorized shops
    post:
      tags: [Organization]
      operationId: createShop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopInput'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Error'
  /carrier-accounts:
    get:
      tags: [Carriers]
      operationId: listCarrierAccounts
      responses:
        '200':
          description: Carrier accounts in scope
    post:
      tags: [Carriers]
      operationId: connectCarrierAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierAccountInput'
      responses:
        '202':
          description: Connection test queued
        '400':
          $ref: '#/components/responses/Error'
  /carrier-accounts/{id}/test:
    post:
      tags: [Carriers]
      operationId: testCarrierAccount
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged source orders
    post:
      tags: [Orders]
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceOrderInput'
      responses:
        '201':
          description: Source order created
        '400':
          $ref: '#/components/responses/Error'
  /orders/{id}/shipping-options:
    post:
      tags: [Shipping]
      operationId: getShippingOptions
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /orders/{id}/routing-decision:
    post:
      tags: [Shipping]
      operationId: selectShippingOption
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
                  format: uuid
                override_reason:
                  type: string
      responses:
        '201':
          description: Routing decision persisted
        '409':
          $ref: '#/components/responses/Error'
  /shipments:
    post:
      tags: [Shipping]
      operationId: createShipment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_order_id, routing_decision_id]
              properties:
                source_order_id:
                  type: string
                  format: uuid
                routing_decision_id:
                  type: string
                  format: uuid
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        '409':
          $ref: '#/components/responses/Error'
  /shipments/{id}:
    get:
      tags: [Shipping]
      operationId: getShipment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Shipment detail
        '404':
          $ref: '#/components/responses/Error'
  /shipments/{id}/cancel:
    post:
      tags: [Shipping]
      operationId: cancelShipment
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /shipments/{id}/label:
    get:
      tags: [Shipping]
      operationId: getShipmentLabel
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Private label download reference or bytes
  /shipments/{id}/redelivery:
    post:
      tags: [Shipping]
      operationId: requestRedelivery
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /shipments/{id}/tracking:
    get:
      tags: [Tracking]
      operationId: getTracking
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Canonical and raw-safe timeline
  /audit-periods:
    post:
      tags: [Reconciliation]
      operationId: createAuditPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditPeriodInput'
      responses:
        '201':
          description: Period created
  /audit-periods/{id}/runs:
    post:
      tags: [Reconciliation]
      operationId: runAudit
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /batches/{id}/bank-allocations:
    post:
      tags: [Reconciliation]
      operationId: allocateBankTransaction
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAllocationInput'
      responses:
        '201':
          description: Allocation confirmed
        '409':
          $ref: '#/components/responses/Error'
  /cases/{id}/transitions:
    post:
      tags: [Claims]
      operationId: transitionCase
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseTransitionInput'
      responses:
        '201':
          description: Case transition recorded
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Error:
      description: Canonical error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded (RATE_LIMITED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CommandAccepted:
      description: Command accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [merchant_name, full_name, password, terms_accepted, terms_version]
      properties:
        merchant_name:
          type: string
          minLength: 2
          maxLength: 100
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        terms_accepted:
          type: boolean
        terms_version:
          type: string
    RegistrationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user_id, merchant_id, status]
          properties:
            user_id:
              type: string
              format: uuid
            merchant_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING_VERIFICATION, ACTIVE]
            email:
              type: string
            phone:
              type: string
            message:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'
    AdminCreateShopAccountRequest:
      type: object
      required: [merchant_name, full_name, password]
      properties:
        merchant_name:
          type: string
          minLength: 2
        full_name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
    AdminCreateShopAccountResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user_id, merchant_id, status]
          properties:
            user_id:
              type: string
              format: uuid
            merchant_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [ACTIVE]
            email:
              type: string
            phone:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    VerifyPhoneRequest:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string
    VerifyResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user_id, merchant_id, status, channel, verified]
          properties:
            user_id:
              type: string
              format: uuid
            merchant_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING_VERIFICATION, ACTIVE]
            channel:
              type: string
              enum: [email, phone]
            verified:
              type: boolean
        meta:
          $ref: '#/components/schemas/Meta'
    ResendVerificationRequest:
      type: object
      required: [identifier, channel]
      properties:
        identifier:
          type: string
        channel:
          type: string
          enum: [email, phone]
    ResendVerificationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status, channel]
          properties:
            status:
              type: string
              enum: [SENT, RATE_LIMITED]
            channel:
              type: string
              enum: [email, phone]
            cooldown_seconds:
              type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
          format: password
        remember_device:
          type: boolean
          default: false
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              enum: [AUTHENTICATED, MFA_REQUIRED, ORG_SELECTION_REQUIRED]
            access_token:
              type: string
            challenge_id:
              type: string
    ShopInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        legal_name:
          type: string
        tax_code:
          type: string
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
    CarrierAccountInput:
      type: object
      required: [carrier_code, alias, permission_profile, credential]
      properties:
        carrier_code:
          type: string
          enum: [GHN, GHTK, VIETTEL_POST, JT_EXPRESS]
        alias:
          type: string
        permission_profile:
          type: string
          enum: [OBSERVE, ACTION]
        credential:
          type: object
          additionalProperties: true
          writeOnly: true
    SourceOrderInput:
      type: object
      # prettier-ignore
      required: [source_order_code, warehouse_id, recipient, address, parcels, expected_cod_vnd, fee_payer]
      properties:
        source_order_code:
          type: string
        warehouse_id:
          type: string
          format: uuid
        recipient:
          type: object
          required: [name, phone]
          properties:
            name:
              type: string
            phone:
              type: string
        address:
          type: object
          required: [line1, province, district, ward]
          properties:
            line1:
              type: string
            province:
              type: string
            district:
              type: string
            ward:
              type: string
        expected_cod_vnd:
          type: integer
          minimum: 0
        fee_payer:
          type: string
          enum: [SHOP, RECIPIENT, OTHER]
        parcels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ParcelInput'
    ParcelInput:
      type: object
      required: [weight_gram, declared_value_vnd]
      properties:
        weight_gram:
          type: integer
          minimum: 1
        length_cm:
          type: integer
          minimum: 1
        width_cm:
          type: integer
          minimum: 1
        height_cm:
          type: integer
          minimum: 1
        declared_value_vnd:
          type: integer
          minimum: 0
    AuditPeriodInput:
      type: object
      required: [carrier_account_id, period_start, period_end]
      properties:
        carrier_account_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
    BankAllocationInput:
      type: object
      required: [bank_transaction_id, allocated_amount_vnd]
      properties:
        bank_transaction_id:
          type: string
          format: uuid
        allocated_amount_vnd:
          type: integer
          minimum: 1
        confirmation_note:
          type: string
    CaseTransitionInput:
      type: object
      required: [target_status, reason]
      properties:
        target_status:
          type: string
        reason:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
        amount_vnd:
          type: integer
          minimum: 0
    CommandResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [command_id, status]
          properties:
            command_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING, SUCCEEDED, FAILED, OUTCOME_UNKNOWN]
            resource_id:
              type: string
              format: uuid
            next_action:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            next_action:
              type: string
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      required: [correlation_id]
      properties:
        correlation_id:
          type: string
    LivenessResponse:
      type: object
      required: [status, service, timestamp, correlationId]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: api
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
    ReadinessResponse:
      type: object
      required: [status, service, timestamp, correlationId, checks]
      properties:
        status:
          type: string
          enum: [ok, error]
        service:
          type: string
          example: api
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        checks:
          type: object
          required: [database, redis, storage]
          properties:
            database:
              type: string
              enum: [up, down]
            redis:
              type: string
              enum: [up, down]
            storage:
              type: string
              enum: [up, down]
          additionalProperties:
            type: string
            enum: [up, down]
