          $ref: '#/components/responses/CommandAccepted'
        '409':
          $ref: '#/components/responses/Error'
  /shipments/{id}:
    get:
      tags: [Shipping]
      operationId: getShipment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Shipment detail
        '404':
          $ref: '#/components/responses/Error'
  /shipments/{id}/cancel:
    post:
      tags: [Shipping]
      operationId: cancelShipment
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /shipments/{id}/label:
    get:
      tags: [Shipping]
      operationId: getShipmentLabel
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Private label download reference or bytes
  /shipments/{id}/redelivery:
    post:
      tags: [Shipping]
      operationId: requestRedelivery
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /shipments/{id}/tracking:
    get:
      tags: [Tracking]
      operationId: getTracking
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Canonical and raw-safe timeline
  /audit-periods:
    post:
      tags: [Reconciliation]
      operationId: createAuditPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditPeriodInput'
      responses:
        '201':
          description: Period created
  /audit-periods/{id}/runs:
    post:
      tags: [Reconciliation]
      operationId: runAudit
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
  /batches/{id}/bank-allocations:
    post:
      tags: [Reconciliation]
      operationId: allocateBankTransaction
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAllocationInput'
      responses:
        '201':
          description: Allocation confirmed
        '409':
          $ref: '#/components/responses/Error'
  /cases/{id}/transitions:
    post:
      tags: [Claims]
      operationId: transitionCase
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseTransitionInput'
      responses:
        '201':
          description: Case transition recorded
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Error:
      description: Canonical error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Unauthenticated request — missing or empty authorization header (UNAUTHENTICATED under AC-SESS-19)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Vui lòng đăng nhập để tiếp tục
              retryable: false
            meta:
              correlation_id: 123e4567-e89b-12d3-a456-426614174000
    SessionInvalid:
      description: Unauthorized request — missing token (UNAUTHENTICATED under AC-SESS-19) or expired/revoked/invalid session (SESSION_INVALID with next_action LOGIN under AC-SESS-06)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              summary: Missing or empty authorization header (AC-SESS-19)
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Vui lòng đăng nhập để tiếp tục
                  retryable: false
                meta:
                  correlation_id: 123e4567-e89b-12d3-a456-426614174000
            session_invalid:
              summary: Session expired, revoked, or token invalid (AC-SESS-06)
              value:
                error:
                  code: SESSION_INVALID
                  message: Phiên đăng nhập đã hết hạn hoặc không hợp lệ
                  retryable: false
                  next_action: LOGIN
                meta:
                  correlation_id: 123e4567-e89b-12d3-a456-426614174000
    RateLimited:
      description: Rate limit exceeded (RATE_LIMITED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CommandAccepted:
      description: Command accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResponse'
  schemas:
    AdminCreateShopInput:
      type: object
      required:
        - merchant_name
      properties:
        merchant_name:
          type: string
          minLength: 2
          maxLength: 255
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
    AdminCreateShopResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - merchant
            - user
            - password_is_temporary
          properties:
            merchant:
              type: object
              required:
                - id
                - name
                - code
                - status
                - created_at
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                code:
                  type: string
                status:
                  type: string
                created_at:
                  type: string
                  format: date-time
            user:
              type: object
              required:
                - id
                - merchant_id
                - full_name
                - role
                - status
              properties:
                id:
                  type: string
                  format: uuid
                merchant_id:
                  type: string
                  format: uuid
                full_name:
                  type: string
                email:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                role:
                  type: string
                status:
                  type: string
                email_verified_at:
                  type: string
                  format: date-time
                  nullable: true
                phone_verified_at:
                  type: string
                  format: date-time
                  nullable: true
            password_is_temporary:
              type: boolean
        meta:
          $ref: '#/components/schemas/Meta'
    AdminListShopsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - shops
            - total
          properties:
            shops:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                  - code
                  - status
                  - created_at
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  code:
                    type: string
                  status:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  user_count:
                    type: integer
                  owner:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                      full_name:
                        type: string
                      email:
                        type: string
                        nullable: true
                      phone:
                        type: string
                        nullable: true
            total:
              type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    RegisterRequest:
      type: object
      required: [merchant_name, full_name, password, terms_accepted, terms_version]
      properties:
        merchant_name:
          type: string
          minLength: 2
          maxLength: 100
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        terms_accepted:
          type: boolean
        terms_version:
          type: string
    RegistrationResponse:
      type: object
