openapi: 3.1.0
info:
  title: Ship Dễ Internal API
  version: 1.0.0
  description: >-
    Baseline frontend/backend contract. The base server path is defined as /api/v1 (Finding 5 / Round 14 / P2-07).
    All endpoint paths declared below (/permissions, /roles, /roles/{id}, etc.) are relative to /api/v1,
    resolving to /api/v1/* in generated API clients to strictly match NestJS @Controller('api/v1') routes.
servers:
  - url: /api/v1
    description: Primary API v1 server mount point (all non-health endpoints resolve under /api/v1)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Organization
  - name: Carriers
  - name: Orders
  - name: Shipping
  - name: Tracking
  - name: Reconciliation
  - name: Claims
  - name: Health
  - name: Search
paths:
  /search:
    get:
      tags: [Search]
      summary: Global search (FEAT-COM-01)
      description: Search across orders, waybills, batches, cases and transactions with tenant scoping and RBAC enforcement.
      operationId: globalSearch
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search keyword (minimum 2 characters)
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: type
          in: query
          required: false
          description: Filter entity type
          schema:
            type: string
            enum: [ALL, ORDER, WAYBILL, BATCH, CASE, TRANSACTION]
            default: ALL
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/Error'
  /health/live:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Operational liveness probe (API-FOUND-HEALTH-LIVE)
      description: Returns 200 when the process is alive without querying downstream dependencies.
      operationId: getHealthLive
      security: []
      responses:
        '200':
          description: Process event loop is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Operational readiness probe (API-FOUND-HEALTH-READY)
      description: Returns 200 when all required infrastructure dependencies (PostgreSQL, Redis, S3) are healthy, or 503 if any dependency is unavailable.
      operationId: getHealthReady
      security: []
      responses:
        '200':
          description: All required dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register new merchant and owner user (API-AUTH-REGISTER)
      description: Creates a new merchant tenant and its initial owner user in a single transaction in pending-verification status.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration initiated, pending verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify user email using verification token (API-AUTH-VERIFY-EMAIL)
      description: Verifies email address using single-use token and activates user if eligible.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /auth/verify-phone:
    post:
      tags: [Auth]
      summary: Verify user phone using OTP (API-AUTH-VERIFY-PHONE)
      description: Verifies phone number using OTP code and activates user if eligible.
      operationId: verifyPhone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneRequest'
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /auth/verify/resend:
    post:
      tags: [Auth]
      summary: Resend verification token or OTP (API-AUTH-RESEND-VERIFICATION)
      description: Re-issues a verification token or phone OTP subject to independent rate limits.
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification token or OTP resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset link (FEAT-AUTH-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: Email or phone number
                channel:
                  type: string
                  enum: [email, phone]
              required:
                - identifier
      responses:
        '200':
          description: Link sent
        '429':
          description: Rate limited

  /auth/verify-reset-token:
    post:
      tags:
        - Auth
      summary: Verify password reset token (FEAT-AUTH-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        '200':
          description: Token valid
        '400':
          description: Invalid, expired, or consumed token
        '403':
          description: Account locked

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password using token (FEAT-AUTH-04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                password_confirm:
                  type: string
              required:
                - token
                - password
                - password_confirm
      responses:
        '200':
          description: Password updated and sessions revoked
        '400':
          description: Invalid token or password mismatch
        '403':
          description: Account locked
        '429':
          description: Rate limited

  /auth/login:
    post:
      tags: [Auth]
      summary: Password login (API-AUTH-LOGIN, FEAT-AUTH-03)
      description: >-
        Authenticates with email/Vietnamese phone + password. Identical
        INVALID_CREDENTIALS response for unknown identifier or wrong password.
        Non-active statuses are rejected with distinct 403 codes
        (AUTH_PENDING_VERIFICATION, AUTH_ACCOUNT_SUSPENDED, AUTH_ACCOUNT_DISABLED,
        AUTH_INVITATION_PENDING). Rate limited per IP and per identifier.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated or MFA challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: INVALID_CREDENTIALS
          $ref: '#/components/responses/Error'
        '403':
          description: Account status gate or OTP login disabled
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login/otp/request:
    post:
      tags: [Auth]
      summary: Request a login OTP (API-AUTH-LOGIN-OTP-REQUEST, FEAT-AUTH-03)
      description: >-
        Sends a 6-digit login OTP over the verified channel (email or phone).
        Requires AUTH_LOGIN_OTP_ENABLED. Generic OTP_SENT response; unknown
        identifiers or unverified channels receive the same response without delivery.
      operationId: requestLoginOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginOtpRequestRequest'
      responses:
        '200':
          description: Generic OTP challenge (anti-enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOtpChallengeResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: AUTH_OTP_LOGIN_DISABLED when OTP login is not enabled
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login/otp/verify:
    post:
      tags: [Auth]
      summary: Verify a login OTP and issue a session (API-AUTH-LOGIN-OTP-VERIFY, FEAT-AUTH-03)
      description: >-
        Verifies the 6-digit login OTP (5-minute TTL, single use, max 5 wrong
        attempts) and returns the same session shape as password login.
      operationId: verifyLoginOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginOtpVerifyRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: INVALID_OTP
          $ref: '#/components/responses/Error'
        '403':
          description: Account status gate or OTP login disabled
          $ref: '#/components/responses/Error'
        '410':
          description: OTP_ALREADY_CONSUMED or OTP_EXPIRED
          $ref: '#/components/responses/Error'
        '429':
          description: OTP_MAX_ATTEMPTS_EXCEEDED or RATE_LIMITED
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/status:
    get:
      tags: [Auth]
      summary: Get MFA enrollment and recovery status (API-AUTH-MFA-STATUS, FEAT-AUTH-05)
      operationId: getMfaStatus
      responses:
        '200':
          description: Current MFA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Initiate authenticator-app TOTP enrollment (API-AUTH-MFA-SETUP, FEAT-AUTH-05)
      operationId: startMfaSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSetupRequest'
      responses:
        '200':
          description: Provisioning URI and manual secret key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: MFA already active
          $ref: '#/components/responses/Error'
  /auth/mfa/setup/verify:
    post:
      tags: [Auth]
      summary: Verify TOTP and activate MFA factor (API-AUTH-MFA-SETUP-VERIFY, FEAT-AUTH-05)
      operationId: verifyMfaSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSetupVerifyRequest'
      responses:
        '200':
          description: Factor activated, returns 10 recovery codes and authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupVerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Activation conflict
          $ref: '#/components/responses/Error'
        '410':
          description: Setup expired
          $ref: '#/components/responses/Error'
  /auth/mfa/challenge/verify:
    post:
      tags: [Auth]
      summary: Verify TOTP login challenge (API-AUTH-MFA-CHALLENGE-VERIFY, FEAT-AUTH-05)
      operationId: verifyMfaChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeVerifyRequest'
      responses:
        '200':
          description: Session issued with auth_assurance=MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid TOTP code
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '410':
          description: Challenge expired or consumed
          $ref: '#/components/responses/Error'
        '429':
          description: Rate limited (challenge or IP threshold)
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/recovery/verify:
    post:
      tags: [Auth]
      summary: Verify recovery code and issue session (API-AUTH-MFA-RECOVERY-VERIFY, FEAT-AUTH-05)
      operationId: verifyMfaRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRecoveryVerifyRequest'
      responses:
        '200':
          description: Code consumed and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryVerifyResponse'
        '400':
          description: Invalid or already consumed recovery code
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '410':
          description: Challenge expired or consumed
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/recovery-codes/regenerate:
    post:
      tags: [Auth]
      summary: Regenerate recovery codes (API-AUTH-MFA-RECOVERY-REGENERATE, FEAT-AUTH-05)
      operationId: regenerateMfaRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRegenerateRecoveryCodesRequest'
      responses:
        '200':
          description: 10 new one-time recovery codes displayed once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRegenerateRecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /users/{user_id}/mfa/reset:
    post:
      tags: [Users]
      summary: Admin reset user MFA factor (API-AUTH-MFA-ADMIN-RESET, FEAT-AUTH-05)
      operationId: adminResetUserMfa
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaAdminResetRequest'
      responses:
        '200':
          description: Factor reset and sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaAdminResetResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Idempotency conflict
          $ref: '#/components/responses/Error'
  # RBAC Endpoints (FEAT-RBAC-01) - Resolves under /api/v1 base server URL (/api/v1/permissions, /api/v1/roles, /api/v1/roles/{id})
  /permissions:
    get:
      tags: [Roles]
      summary: List platform capability permissions catalog (FEAT-RBAC-01)
      operationId: listPermissions
      responses:
        '200':
          description: List of all canonical platform capability permissions grouped by category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          $ref: '#/components/responses/Error'
  /roles:
    get:
      tags: [Roles]
      summary: List system and custom roles for tenant (FEAT-RBAC-01)
      operationId: listRoles
      responses:
        '200':
          description: List of system roles and merchant-scoped custom roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Roles]
      summary: Create a custom role for tenant (FEAT-RBAC-01)
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /roles/{id}:
    get:
      tags: [Roles]
      summary: Get detailed role definition by id (FEAT-RBAC-01)
      operationId: getRoleById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role detail including capability permissions and assigned user count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Roles]
      summary: Update custom role definition (FEAT-RBAC-01)
      operationId: updateRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Roles]
      summary: Delete an unassigned custom role (FEAT-RBAC-01)
      operationId: deleteRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRoleResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /users:
    get:
      tags: [Users]
      summary: List merchant users (API-USR-LIST, FEAT-USR-02, FEAT-RBAC-02)
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [OWNER, OPS_CSKH, WAREHOUSE, ACCOUNTANT, FINANCE]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, DISABLED, PENDING_VERIFICATION, INVITED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of tenant users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user details (API-USR-GET, FEAT-USR-02)
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile and scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Users]
      summary: Update user profile and scopes (API-USR-UPDATE, FEAT-USR-02)
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /users/{id}/scopes:
    get:
      tags: [Users]
      summary: Get user scope assignments (API-USR-GET-SCOPES, FEAT-RBAC-02)
      operationId: getUserScopes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User scope assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserScopesResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Users]
      summary: Update user scope assignments (API-USR-UPDATE-SCOPES, FEAT-RBAC-02)
      operationId: updateUserScopes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserScopesRequest'
      responses:
        '200':
          description: Updated user scope assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserScopesResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /users/{id}/suspend:
    post:
      tags: [Users]
      summary: Suspend user account (API-USR-SUSPEND, FEAT-USR-02)
      operationId: suspendUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
      responses:
        '200':
          description: User suspended and sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendUserResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
