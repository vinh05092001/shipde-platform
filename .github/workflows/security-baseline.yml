name: Security baseline

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run Clean Secret Scan
        run: npm run security:secrets
      - name: Verify Secret Scan Negative Proof
        run: |
          if npm run security:secrets -- --test-negative; then
            echo "Error: Expected secret-scan negative proof to exit non-zero!"
            exit 1
          else
            echo "Success: Secret-scan negative proof exited non-zero as required by AC-FOUND-01-06."
          fi
