name: AI Brain test suite

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TASK-AI-142: compare against the PR base branch.
      - name: Check no hardcode guard
        run: node scripts/ai/check-no-hardcode.mjs
      - name: Context pack through pinned repomix (live)
        run: pnpm test:context-pack
      - name: Run AI Brain test suite
        run: pnpm test:brain
