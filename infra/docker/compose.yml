name: shipde-platform

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: shipde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shipde_dev}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - shipde-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shipde_dev}']
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7.4.2-alpine
    container_name: shipde-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - shipde-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: shipde-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - shipde-minio-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  shipde-postgres-data:
    name: shipde-postgres-data
  shipde-redis-data:
    name: shipde-redis-data
  shipde-minio-data:
    name: shipde-minio-data
