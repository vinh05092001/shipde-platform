<!doctype html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ship Dễ — Model Rotation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body{background:#080d1a;color:#f1f5f9;font-family:ui-sans-serif,system-ui,sans-serif;overflow-x:hidden;margin:0}
@keyframes dash-flow{to{stroke-dashoffset:-20}}
.arrow-live{stroke-dasharray:8 4;animation:dash-flow .6s linear infinite}
.node-dimmed{opacity:.35}
</style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
<h1 class="text-xl font-bold mb-2 text-brand">Model Rotation</h1>
<p class="text-sm text-slate-400 mb-4">Live dispatch topology — polls /api/rotation every 5s</p>
<div id="rotation-container" class="w-full max-w-4xl flex justify-center">
<svg id="rotation-svg" viewBox="0 0 800 800" class="w-full max-w-2xl"></svg>
</div>
<div id="source-cards" class="w-full max-w-4xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-6"></div>
<script>
const POLL_MS=5000;
const CX=400,CY=400,RADIUS=280;
const SVG_NS='http://www.w3.org/2000/svg';

function el(tag,attrs,text){
  const e=document.createElementNS(SVG_NS,tag);
  if(attrs)for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  if(text)e.textContent=text;
  return e;
}

function renderRotation(data){
  const svg=document.getElementById('rotation-svg');
  svg.innerHTML='';
  const cards=document.getElementById('source-cards');
  cards.innerHTML='';
  if(!data||!data.sources)return;

  // Hub
  svg.appendChild(el('circle',{cx:CX,cy:CY,r:50,fill:'#1e293b',stroke:'#ea4b12','stroke-width':3}));
  svg.appendChild(el('text',{x:CX,y:CY+5,'text-anchor':'middle',fill:'#f1f5f9','font-size':'12','font-weight':'bold'},'Dispatcher'));

  const sources=data.sources.filter(s=>s.configured);
  const n=sources.length||1;

  sources.forEach((src,i)=>{
    const angle=(2*Math.PI*i)/n - Math.PI/2;
    const nx=CX+RADIUS*Math.cos(angle);
    const ny=CY+RADIUS*Math.sin(angle);
    const isDimmed=src.status==='cooldown'||src.status==='quota-exhausted';
    const g=el('g',{class:isDimmed?'node-dimmed':''});

    // Arrow from hub to node
    const line=el('line',{x1:CX,y1:CY,x2:nx,y2:ny,stroke:src.status==='live'?'#22c55e':'#334155','stroke-width':2});
    if(src.status==='live')line.setAttribute('class','arrow-live');
    g.appendChild(line);

    // Arrow label (model + tokens)
    if(src.activeRun&&src.activeRun.modelId){
      const mx=(CX+nx)/2, my=(CY+ny)/2;
      const label=src.activeRun.modelId+' '+(src.activeRun.tokensSoFar==='UNKNOWN'?'?':src.activeRun.tokensSoFar)+'tk';
      g.appendChild(el('text',{x:mx,y:my-6,'text-anchor':'middle',fill:'#94a3b8','font-size':'10'},label));
    }

    // Node circle
    const color=src.status==='live'?'#22c55e':src.status==='cooldown'?'#ef4444':'#3b82f6';
    g.appendChild(el('circle',{cx:nx,cy:ny,r:30,fill:'#0f172a',stroke:color,'stroke-width':2}));
    g.appendChild(el('text',{x:nx,y:ny+4,'text-anchor':'middle',fill:'#f1f5f9','font-size':'10','font-weight':'bold'},src.label.length>10?src.id:src.label));

    // Cooldown reason
    if(isDimmed&&src.cooldown&&src.cooldown.reason){
      g.appendChild(el('text',{x:nx,y:ny+46,'text-anchor':'middle',fill:'#ef4444','font-size':'9'},src.cooldown.reason.slice(0,30)));
      if(src.cooldown.until)g.appendChild(el('text',{x:nx,y:ny+58,'text-anchor':'middle',fill:'#94a3b8','font-size':'8'},'until '+src.cooldown.until.slice(11,19)));
    }
    svg.appendChild(g);

    // HTML card below
    const lim=src.limits||{};
    const runs=src.recentRuns||[];
    const done=runs.filter(r=>r.outcome==='done').length;
    const failed=runs.filter(r=>r.outcome==='failed').length;
    const refused=runs.filter(r=>r.outcome==='quota-refused').length;
    const card=document.createElement('div');
    card.className='bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs'+(isDimmed?' opacity-40':'');
    card.innerHTML=`<div class="font-bold text-sm mb-1">${src.label} <span class="text-slate-400">(${src.status})</span></div>
<div>Limit: <span class="font-mono">${lim.declaredLimit==='UNKNOWN'?'UNKNOWN':lim.declaredLimit}</span></div>
<div>Used: <span class="font-mono">${lim.consumption==='UNKNOWN'?'UNKNOWN':lim.consumption}</span></div>
<div>Headroom: <span class="font-mono">${lim.headroom==='UNKNOWN'?'UNKNOWN':lim.headroom}</span></div>
<div class="flex gap-1 mt-2">
  <span class="bg-emerald-900 text-emerald-300 px-1 rounded">${done} done</span>
  <span class="bg-rose-900 text-rose-300 px-1 rounded">${failed} fail</span>
  <span class="bg-amber-900 text-amber-300 px-1 rounded">${refused} refused</span>
</div>`;
    cards.appendChild(card);
  });
}

async function poll(){
  try{
    const r=await fetch('/api/rotation');
    if(r.ok){const d=await r.json();renderRotation(d);}
  }catch(e){console.error('rotation poll failed',e);}
}
poll();
setInterval(poll,POLL_MS);
</script>
</body>
</html>
